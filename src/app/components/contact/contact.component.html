<div id="contact">
  <div class="items-container">
    <div class="contact_wrapper">
      <h1>Contact Me</h1>
      <p>Got a project waiting to be realized? Let's collaborate and make it happen!</p>

      <div class="contact-list">
        <a class="contact-item" href="https://github.com/manh-huan" target="_blank" rel="noreferrer">
          <fa-icon [icon]="faGithub" size="lg"></fa-icon>
          <span class="contact-label">GitHub</span>
          <span class="contact-value">github.com/manh-huan</span>
        </a>
        <a class="contact-item" href="https://www.linkedin.com/in/manh-huan-nguyen-aa4b97203/" target="_blank" rel="noreferrer">
          <fa-icon [icon]="faLinkedinIn" size="lg"></fa-icon>
          <span class="contact-label">LinkedIn</span>
          <span class="contact-value">manh-huan-nguyen</span>
        </a>
        <div class="contact-item static">
          <fa-icon [icon]="faLocationDot" size="lg"></fa-icon>
          <span class="contact-label">Based in</span>
          <span class="contact-value">Strasbourg, France</span>
        </div>
      </div>

      <div class="contact-actions">
        <a class="contact-button" href="https://github.com/manh-huan" target="_blank" rel="noreferrer">
          See my work on GitHub
          <fa-icon [icon]="faArrowUpRightFromSquare"></fa-icon>
        </a>
        <a class="contact-button" href="https://www.linkedin.com/in/manh-huan-nguyen-aa4b97203/" target="_blank" rel="noreferrer">
          Connect on LinkedIn
          <fa-icon [icon]="faArrowUpRightFromSquare"></fa-icon>
        </a>
      </div>
    </div>
  </div>
</div>
