<div id="history">
  <div class="items-container">
    <h1>Career History</h1>
    <div class="vertical-timeline" #timeline>
      @for (event of events; track event.title; let i = $index) {
        <div class="vt-element" [class.vt-left]="i % 2 === 0">
          <div class="vt-date">{{ event.date }}</div>
          <span class="vt-icon"><fa-icon [icon]="faBriefcase"></fa-icon></span>
          <div class="vt-card">
            <h3 class="vt-title">{{ event.title }}</h3>
            @if (event.subtitle) {
              <h4 class="vt-subtitle">{{ event.subtitle }}</h4>
            }
            @if (event.description) {
              <p class="vt-desc">{{ event.description }}</p>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
